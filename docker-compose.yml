services:
  db:
    image: postgres:16
    container_name: workout-db
    restart: unless-stopped
    ports:
      - "5111:5432"
    environment:
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: workout_pass
      POSTGRES_DB: workout_mvp
    volumes:
      - workout_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_user -d workout_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workout_db_data: